aid: inscopehq
name: Inscope
description: >-
  Inscope is an AI-powered financial reporting and automation platform for
  accounting firms and enterprise finance teams. It drafts accurate,
  GAAP-compliant financial statements, cash flow statements, and audit
  workpapers in minutes, keeping a human reviewer in the loop to review and
  sign off. The platform targets the financial close, reporting, and audit
  workflow, and states SOC 2 Type I and Type II certification with GDPR/CCPA
  compliance. Inscope is a private SaaS backed by Norwest Venture Partners; it
  publishes no public product API or developer portal today. Customer sign-in
  runs on a PropelAuth-hosted OpenID Connect tenant at auth.inscopehq.com.
